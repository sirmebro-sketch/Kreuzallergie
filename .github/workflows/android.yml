name: Android APK und Prüfungen
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  logic:
    name: Inhalts- und Bewertungslogik
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  android:
    name: Android APK bauen
    needs: logic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK installieren
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Entwicklungssignatur für Folgeinstallationen erhalten
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: beifusskompass-development-signing-v1
      - name: APK und Android Lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - name: Installationsdatei benennen
        run: cp app/build/outputs/apk/debug/app-debug.apk BeifussKompass-1.1.0.apk
      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: BeifussKompass-Android-APK
          path: BeifussKompass-1.1.0.apk
          retention-days: 90
      - name: Lint-Bericht bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Lint
          path: app/build/reports/lint-results-debug.html
  interface:
    name: Bedienung auf kleinen und großen Displays
    needs: logic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Oberflaechen-Pruefung
          path: test-results/
  android-smoke:
    name: APK auf Android starten
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: BeifussKompass-Android-APK
          path: apk
      - name: KVM für Emulator bereitstellen
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 scripts/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-Startpruefung
          path: android-smoke/
